<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SRM SYNC</title>
<meta name="description" content="An alternative student portal for SRM AP: mark attendance, plan attendance, and check your timetable, marks and results.">
<meta property="og:title" content="SRM SYNC">
<meta property="og:description" content="An alternative student portal for SRM AP: mark attendance, plan attendance, and check your timetable, marks and results.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#151920">

<!-- Favicons are real files (not data: URIs) so browsers and search engines
     can fetch them; /favicon.ico also exists for the automatic request. -->
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" href="/favicon.png" sizes="96x96">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<!-- Theme is resolved before first paint so a light-mode user never sees a
     dark flash. Same storage key and default as before. -->
<script>
  (function () {
    try {
      var stored = localStorage.getItem('theme');
      var theme = stored === 'light' || stored === 'dark'
        ? stored
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
      var accent = localStorage.getItem('accent');
      if (accent === 'teal' || accent === 'violet' || accent === 'graphite') {
        document.documentElement.setAttribute('data-accent', accent);
      }
    } catch (e) { /* private mode — keep the markup default */ }
  })();
</script>

<!-- Webfont is non-blocking: it loads as print media and flips to all once
     fetched, with a system-font fallback (display=swap) in the meantime. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all';this.onload=null">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"></noscript>

<link rel="stylesheet" href="css/system.css">
<link rel="stylesheet" href="css/app.css">

<!-- No build step: the app is plain ES modules. Preloading flattens the
     import waterfall into one parallel batch. -->
<link rel="modulepreload" href="js/main.js">
<link rel="modulepreload" href="js/shell.js">
<link rel="modulepreload" href="js/lib/dom.js">
<link rel="modulepreload" href="js/lib/icons.js">
<link rel="modulepreload" href="js/lib/storage.js">
<link rel="modulepreload" href="js/lib/api.js">
<link rel="modulepreload" href="js/lib/store.js">
<link rel="modulepreload" href="js/lib/ui.js">
<link rel="modulepreload" href="js/lib/schedule.js">
<link rel="modulepreload" href="js/lib/attendance-math.js">
<link rel="modulepreload" href="js/lib/widgets.js">
<link rel="modulepreload" href="js/views/login.js">
<link rel="modulepreload" href="js/views/home.js">
<link rel="modulepreload" href="js/views/mark.js">
<link rel="modulepreload" href="js/views/attendance.js">
<link rel="modulepreload" href="js/views/timetable.js">
<link rel="modulepreload" href="js/views/courses.js">
<link rel="modulepreload" href="js/views/marks.js">
<link rel="modulepreload" href="js/views/results.js">
<link rel="modulepreload" href="js/views/feedback.js">
<link rel="modulepreload" href="js/views/profile.js">
</head>
<body>

  <noscript>
    <div class="noscript">SRM SYNC needs JavaScript to sign in and load your portal data. Please enable it and reload.</div>
  </noscript>

  <!-- Sign-in screen (rendered by js/views/login.js) -->
  <div id="auth" class="auth" hidden></div>

  <!-- Signed-in app shell (rendered by js/shell.js) -->
  <div id="shell" class="shell" hidden>
    <aside id="sidebar" class="sidebar"></aside>

    <div class="shell__main">
      <header id="topbar" class="topbar"></header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>

    <nav id="tabbar" class="tabbar" aria-label="Primary"></nav>
  </div>

  <div id="toasts" class="toasts" role="region" aria-label="Notifications"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
